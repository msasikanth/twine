name: Desktop Distributables

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve app version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NAME="$RELEASE_TAG"
          if [ -z "$NAME" ]; then
            NAME="$(git describe --tags --abbrev=0 2>/dev/null || echo 1.0.0)"
          fi
          echo "name=${NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: version
    env:
      ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.version.outputs.name }}
      ORG_GRADLE_PROJECT_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
          cache: 'gradle'
      - name: Build MSI
        run: ./gradlew :desktopApp:packageReleaseMsi --no-daemon
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: Twine-Windows
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi
      - name: Upload MSI to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} desktopApp/build/compose/binaries/main-release/msi/*.msi --clobber

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: version
    env:
      ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.version.outputs.name }}
      ORG_GRADLE_PROJECT_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
          cache: 'gradle'
      - name: Build DEB
        run: ./gradlew :desktopApp:packageReleaseDeb --no-daemon
      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: Twine-Linux
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb
      - name: Upload DEB to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} desktopApp/build/compose/binaries/main-release/deb/*.deb --clobber
